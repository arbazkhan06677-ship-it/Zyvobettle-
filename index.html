<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0f">

<title>ZyvoBattle — Tournaments</title>

<style>
:root {
  --bg: #0b0b0f;
  --panel: #17171d;
  --red: #ff3038;
  --green: #00c853;
  --text: #f5f5f7;
  --muted: #aaaab5;
  --line: #34343e;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 15px/1.5 Arial, sans-serif;
  padding-bottom: 40px;
}

.wrap {
  max-width: 600px;
  margin: auto;
  padding: 14px;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}

.brand {
  font-size: 20px;
  font-weight: 900;
}

.brand span {
  color: var(--red);
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  margin-top: 12px;
}

input {
  display: block;
  width: 100%;
  padding: 12px;
  background: #101015;
  color: white;
  border: 1px solid #454550;
  border-radius: 8px;
  margin: 8px 0 14px;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 8px;
  background: var(--red);
  color: white;
  font-weight: bold;
  padding: 12px;
  width: 100%;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.hidden {
  display: none !important;
}

.muted {
  color: var(--muted);
}

.green-text {
  color: var(--green);
  overflow-wrap: anywhere;
}

.status {
  padding: 10px;
  border-radius: 8px;
  background: #202027;
  margin-top: 12px;
  overflow-wrap: anywhere;
}

.match-title {
  margin-top: 0;
}

.small {
  font-size: 13px;
  color: var(--muted);
}
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="brand">⚔️ ZYVO<span>BATTLE</span></div>

    <div id="topBal" class="hidden"
         style="color:#ffd700;font-weight:bold">
      🪙 ₹<span id="bal">0</span>
    </div>
  </div>

  <div id="connectionStatus" class="status">
    Connecting to Firebase...
  </div>

  <!-- LOGIN / REGISTER -->
  <div id="authBox" class="card">
    <h3>🔥 Player Login / Register</h3>

    <label for="name">Free Fire Name</label>
    <input id="name" maxlength="40"
           placeholder="Free Fire Name (Jaise: CR7)"
           autocomplete="nickname">

    <label for="uid">Free Fire UID</label>
    <input id="uid" inputmode="numeric"
           maxlength="30"
           placeholder="Free Fire UID"
           autocomplete="off">

    <label for="pass">Password</label>
    <input id="pass" type="password"
           maxlength="100"
           placeholder="Password"
           autocomplete="current-password">

    <button id="authBtn">Login / Register</button>

    <p class="small">
      Apna Free Fire UID aur password sahi enter karein.
    </p>
  </div>

  <!-- DASHBOARD -->
  <div id="appBox" class="hidden">

    <div class="card">
      <h3>🏆 Live Tournaments</h3>
      <div id="matchesList">
        <p class="muted">Loading matches...</p>
      </div>
    </div>

    <button id="logoutBtn"
            style="background:#333;margin-top:20px">
      Logout
    </button>

  </div>

</div>

<script type="module">
import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  initializeFirestore,
  getFirestore,
  doc,
  getDoc,
  setDoc,
  onSnapshot,
  collection
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/*
  IMPORTANT:
  Apne Firebase project ki existing configuration use karo.
*/
const firebaseConfig = {
  apiKey: "AIzaSyDJpr9gktLVZgPOF2K89mOlubJrddw9OT0",
  authDomain: "zyvobettle.firebaseapp.com",
  projectId: "zyvobettle",
  storageBucket: "zyvobettle.firebasestorage.app",
  messagingSenderId: "335264733948",
  appId: "1:335264733948:web:30217c54d3e15c8b1bd579"
};

const $ = id => document.getElementById(id);

let db;
let currentUserUid = null;
let stopUserListener = null;
let stopTournamentListener = null;

function setStatus(message) {
  $("connectionStatus").textContent = message;
}

function friendlyError(error) {
  console.error("Firebase error:", error);

  const code = error?.code || "unknown";
  const message = error?.message || "Unknown error";

  if (code === "permission-denied") {
    return "Permission denied. Firestore Security Rules check karo.";
  }

  if (code === "unavailable") {
    return "Firebase unavailable. Internet aur Firestore connection check karo.";
  }

  if (code === "unauthenticated") {
    return "Authentication required. Login configuration check karo.";
  }

  if (code === "failed-precondition") {
    return "Firestore configuration ya database condition check karo.";
  }

  if (code === "not-found") {
    return "Firestore database nahi mila. Firebase Console check karo.";
  }

  return "Error (" + code + "): " + message;
}

/*
  Initialize Firebase with long-polling support.
  This may help on networks where normal Firestore
  streaming connections fail.
*/
try {
  const firebaseApp = initializeApp(firebaseConfig);

  try {
    db = initializeFirestore(firebaseApp, {
      experimentalAutoDetectLongPolling: true
    });
  } catch (error) {
    if (
      error.code === "failed-precondition" ||
      error.code === "already-initialized"
    ) {
      db = getFirestore(firebaseApp);
    } else {
      throw error;
    }
  }

  setStatus("Firebase initialized. Checking database...");
} catch (error) {
  setStatus(friendlyError(error));
  $("authBtn").disabled = true;
}

/*
  Stop previous listeners to avoid duplicate connections.
*/
function stopListeners() {
  if (stopUserListener) {
    stopUserListener();
    stopUserListener = null;
  }

  if (stopTournamentListener) {
    stopTournamentListener();
    stopTournamentListener = null;
  }
}

/*
  Login / Register.

  IMPORTANT:
  This preserves the original demo database structure.
  Storing plaintext passwords in Firestore is NOT secure.
  Use Firebase Authentication before public launch.
*/
$("authBtn").addEventListener("click", async () => {
  if (!db) {
    alert("Firebase initialize nahi hua. Connection check karo.");
    return;
  }

  const name = $("name").value.trim();
  const uid = $("uid").value.trim();
  const password = $("pass").value;

  if (!name || !uid || !password) {
    alert("Sabhi fields bharna zaroori hai!");
    return;
  }

  if (!/^[0-9]+$/.test(uid)) {
    alert("Free Fire UID mein sirf numbers enter karo.");
    return;
  }

  $("authBtn").disabled = true;
  $("authBtn").textContent = "Please wait...";

  try {
    const userRef = doc(db, "users", uid);
    const snapshot = await getDoc(userRef);

    if (snapshot.exists()) {
      const userData = snapshot.data();

      if (userData.password !== password) {
        alert("Galat Password!");
        return;
      }

      if (userData.name && userData.name !== name) {
        const proceed = confirm(
          "Is UID par doosra player name saved hai. Continue?"
        );

        if (!proceed) return;
      }

      localStorage.setItem("userUid", uid);
      await startApp(uid);

    } else {
      await setDoc(userRef, {
        name: name,
        uid: uid,
        password: password,
        wallet: 0,
        createdAt: new Date().toISOString()
      });

      localStorage.setItem("userUid", uid);
      await startApp(uid);
    }

  } catch (error) {
    alert(friendlyError(error));
    setStatus(friendlyError(error));
  } finally {
    $("authBtn").disabled = false;
    $("authBtn").textContent = "Login / Register";
  }
});

/*
  Start player dashboard and live Firestore listeners.
*/
async function startApp(uid) {
  if (!db) {
    setStatus("Firebase database initialize nahi hua.");
    return;
  }

  stopListeners();

  currentUserUid = uid;

  $("authBox").classList.add("hidden");
  $("appBox").classList.remove("hidden");
  $("topBal").classList.remove("hidden");

  $("matchesList").innerHTML =
    '<p class="muted">Loading matches...</p>';

  setStatus("Connecting to player account...");

  stopUserListener = onSnapshot(
    doc(db, "users", uid),

    snapshot => {
      if (!snapshot.exists()) {
        setStatus("Player account nahi mila. Dobara login karo.");
        localStorage.removeItem("userUid");
        return;
      }

      const userData = snapshot.data();

      $("bal").textContent = Number(userData.wallet || 0).toFixed(2);

      setStatus("✅ Firebase connected.");
    },

    error => {
      setStatus(friendlyError(error));
    }
  );

  stopTournamentListener = onSnapshot(
    collection(db, "tournaments"),

    snapshot => {
      const tournaments = snapshot.docs.map(item => ({
        id: item.id,
        ...item.data()
      }));

      if (tournaments.length === 0) {
        $("matchesList").innerHTML =
          '<p class="muted">Abhi koi match uplabdh nahi hai.</p>';
        return;
      }

      /*
        Render tournament information safely.
        Do not inject database values directly into innerHTML.
      */
      const container = $("matchesList");
      container.replaceChildren();

      tournaments.forEach(tournament => {
        const card = document.createElement("div");
        card.className = "card";

        const title = document.createElement("h4");
        title.className = "match-title";
        title.textContent = tournament.name || "Match";

        const details = document.createElement("p");
        details.textContent =
          "Entry: ₹" + (tournament.entryFee ?? 0) +
          " | Prize: ₹" + (tournament.prize ?? 0);

        const room = document.createElement("p");
        room.className = "green-text";

        room.textContent =
          "Room ID/Pass: " +
          (tournament.roomId || "Match shuru hone par milega");

        card.append(title, details, room);
        container.appendChild(card);
      });
    },

    error => {
      $("matchesList").textContent = friendlyError(error);
      setStatus(friendlyError(error));
    }
  );
}

/*
  Logout.
*/
$("logoutBtn").addEventListener("click", () => {
  stopListeners();

  localStorage.removeItem("userUid");
  currentUserUid = null;

  $("appBox").classList.add("hidden");
  $("authBox").classList.remove("hidden");
  $("topBal").classList.add("hidden");

  $("pass").value = "";

  setStatus("Logged out.");
});

/*
  Restore saved demo session.
*/
const savedUid = localStorage.getItem("userUid");

if (savedUid && db) {
  startApp(savedUid);
}
</script>
</body>
</html>
