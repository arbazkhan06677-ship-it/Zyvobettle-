<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZyvoBattle — Tournaments</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171d;--panel2:#202027;--red:#ff3038;--green:#00c853;--text:#f5f5f7;--muted:#aaaab5;--line:#34343e}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 sans-serif;padding-bottom:70px}
.wrap{max-width:600px;margin:auto;padding:14px}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:900}.brand span{color:var(--red)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
input{width:100%;padding:12px;background:#101015;color:#fff;border:1px solid #454550;border-radius:8px;margin:6px 0 12px}
button{border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:bold;padding:12px;width:100%;cursor:pointer}
button.green{background:var(--green)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">⚔️ ZYVO<span>BATTLE</span></div>
    <div id="topBal" class="hidden" style="color:#ffd700;font-weight:bold">🪙 ₹<span id="bal">0</span></div>
  </div>

  <!-- LOGIN BOX -->
  <div id="authBox" class="card">
    <h3>🔥 Player Login / Register</h3>
    <input id="name" placeholder="Free Fire Name (Jaise: CR7)">
    <input id="uid" placeholder="Free Fire UID (Jaise: 530335383)">
    <input id="pass" type="password" placeholder="Password">
    <button id="authBtn">Login / Register</button>
  </div>

  <!-- DASHBOARD -->
  <div id="appBox" class="hidden">
    <h3>🏆 Live Tournaments</h3>
    <div id="matchesList"><p style="color:var(--muted)">Loading matches...</p></div>
    <button id="logoutBtn" style="background:#333;margin-top:20px">Logout</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJpr9gktLVZgPOF2K89mOlubJrddw9OT0",
  authDomain: "zyvobettle.firebaseapp.com",
  projectId: "zyvobettle",
  storageBucket: "zyvobettle.firebasestorage.app",
  messagingSenderId: "335264733948",
  appId: "1:335264733948:web:30217c54d3e15c8b1bd579"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

$("authBtn").addEventListener("click", async () => {
  const n = $("name").value.trim();
  const u = $("uid").value.trim();
  const p = $("pass").value.trim();

  if(!n || !u || !p) return alert("Sabhi fields bharna zaroori hai!");

  try {
    const ref = doc(db, "users", u);
    const snap = await getDoc(ref);
    if(snap.exists()){
      if(snap.data().password !== p) return alert("Galat Password!");
      localStorage.setItem("userUid", u);
      startApp(u);
    } else {
      await setDoc(ref, { name: n, uid: u, password: p, wallet: 0 });
      localStorage.setItem("userUid", u);
      startApp(u);
    }
  } catch(e) {
    alert("Database Error: " + e.message);
  }
});

function startApp(u){
  $("authBox").classList.add("hidden");
  $("appBox").classList.remove("hidden");
  $("topBal").classList.remove("hidden");

  onSnapshot(doc(db, "users", u), docSnap => {
    if(docSnap.exists()){
      $("bal").textContent = docSnap.data().wallet || 0;
    }
  });

  onSnapshot(collection(db, "tournaments"), snap => {
    const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
    $("matchesList").innerHTML = list.length ? list.map(t => `
      <div class="card">
        <h4>${t.name || "Match"}</h4>
        <p>Entry: ₹${t.entryFee || 0} | Prize: ₹${t.prize || 0}</p>
        <p style="color:var(--green)">Room ID/Pass: ${t.roomId || "Match shuru hone par milega"}</p>
      </div>
    `).join("") : "<p style='color:var(--muted)'>Abhi koi match uplabdh nahi hai.</p>";
  });
}

$("logoutBtn").addEventListener("click", () => {
  localStorage.removeItem("userUid");
  location.reload();
});

const saved = localStorage.getItem("userUid");
if(saved) startApp(saved);
</script>
</body>
</html>
