<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZyvoBattle Live Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif;padding:15px}
header{background:#1c1c1c;padding:16px;border-radius:12px;border-left:5px solid #ff3030}
h1,h2{margin:0 0 10px 0;color:#ff3030}
.card{background:#1e1e24;padding:15px;margin-top:16px;border-radius:12px;border:1px solid #333}
input,select,button{width:100%;padding:11px;margin-top:8px;border-radius:8px;border:1px solid #444;font-size:14px}
input,select{background:#111;color:white}
button{background:#ff3030;color:white;font-weight:bold;border:0;cursor:pointer}
button.green{background:#00c853}
.item{background:#141418;border:1px solid #333;padding:12px;margin-top:10px;border-radius:8px}
small{color:#aaa}
</style>
</head>
<body>

<header>
  <h1>⚔️ ZyvoBattle Admin</h1>
  <small>Connected Live with Firebase Database</small>
</header>

<!-- 1. UPI SETTING -->
<div class="card">
  <h2>💳 Admin UPI Setting</h2>
  <input id="upiId" placeholder="Apni UPI ID dalein (Jaise: 9876543210@paytm)">
  <button onclick="saveUpi()">Save UPI ID</button>
</div>

<!-- 2. CREATE TOURNAMENT -->
<div class="card">
  <h2>➕ Create Live Tournament</h2>
  <input id="tName" placeholder="Tournament Name (e.g. Bermuda Night Match #1)">
  <select id="tMode">
    <option>Solo</option>
    <option>Duo</option>
    <option>Squad</option>
    <option>Clash Squad</option>
  </select>
  <input id="tEntry" type="number" placeholder="Entry Fee (₹)">
  <input id="tPrize" type="number" placeholder="Winner Prize (₹)">
  <input id="tKill" type="number" placeholder="Per Kill Reward (₹)">
  <input id="tDate" placeholder="Match Date & Time (e.g. Today 8:00 PM)">
  <button onclick="createMatch()">Publish Match Live</button>
</div>

<!-- 3. MANAGE TOURNAMENTS & ROOM ID -->
<div class="card">
  <h2>🏆 Manage Matches & Room ID</h2>
  <div id="matchList">Loading matches...</div>
</div>

<!-- 4. WALLET REQUESTS (DEPOSIT / WITHDRAW) -->
<div class="card">
  <h2>💰 Wallet Requests (Deposit / Withdraw)</h2>
  <div id="walletList">Loading requests...</div>
</div>

<!-- 5. SEND PRIZE / ADD MONEY DIRECTLY -->
<div class="card">
  <h2>🎁 Send Winning Prize to Player Wallet</h2>
  <input id="winUid" type="number" placeholder="Player Free Fire UID">
  <input id="winAmt" type="number" placeholder="Winning Amount to Add (₹)">
  <button class="green" onclick="sendPrize()">Add Money to Player Wallet</button>
</div>

<!-- 6. LEADERBOARD UPDATE -->
<div class="card">
  <h2>📊 Update Leaderboard</h2>
  <input id="lbName" placeholder="Player Name">
  <input id="lbPts" type="number" placeholder="Total Kill Points">
  <button onclick="addLeaderboard()">Save Leaderboard Score</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { initializeFirestore, collection, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const pin = prompt("Enter Admin PIN (Default: 1234):");
if(pin !== "1234"){
  document.body.innerHTML = "<h2 style='color:red;text-align:center'>Access Denied! Wrong Admin PIN.</h2>";
  throw new Error("Unauthorized");
}

const firebaseConfig = {
  apiKey: "AIzaSyDJpr9gktLVZgPOF2K89mOlubJrddw9OT0",
  authDomain: "zyvobettle.firebaseapp.com",
  projectId: "zyvobettle",
  storageBucket: "zyvobettle.firebasestorage.app",
  messagingSenderId: "335264733948",
  appId: "1:335264733948:web:30217c54d3e15c8b1bd579",
  measurementId: "G-DKB22GRV6R"
};

const app = initializeApp(firebaseConfig);
const db = initializeFirestore(app, { experimentalForceLongPolling: true });
const $ = id => document.getElementById(id);

window.saveUpi = async () => {
  const upiId = $("upiId").value.trim();
  if(!upiId) return alert("UPI ID dalein!");
  await setDoc(doc(db, "settings", "config"), { upiId });
  alert("✅ UPI ID update ho gayi!");
};

window.createMatch = async () => {
  const name = $("tName").value.trim();
  const mode = $("tMode").value;
  const entryFee = Number($("tEntry").value) || 0;
  const prize = Number($("tPrize").value) || 0;
  const perKill = Number($("tKill").value) || 0;
  const date = $("tDate").value.trim();

  if(!name) return alert("Tournament name dalein!");
  await addDoc(collection(db, "tournaments"), {
    name, mode, entryFee, prize, perKill, date, roomId: "", roomPass: "", joinedPlayers: []
  });
  $("tName").value=""; $("tEntry").value=""; $("tPrize").value=""; $("tKill").value=""; $("tDate").value="";
  alert("🔥 Match Live publish ho gaya!");
};

onSnapshot(collection(db, "tournaments"), snap => {
  const list = snap.docs.map(d => ({id: d.id, ...d.data()}));
  $("matchList").innerHTML = list.length ? list.map(t => {
    const players = (t.joinedPlayers || []).map(p => `${p.name} (${p.uid})`).join(", ") || "None";
    return `
    <div class="item">
      <b>${t.name}</b> (${t.mode}) — Entry: ₹${t.entryFee} | Prize: ₹${t.prize}<br>
      <small>Joined (${(t.joinedPlayers||[]).length}): ${players}</small>
      <input id="rid_${t.id}" placeholder="Room ID" value="${t.roomId || ''}">
      <input id="rpass_${t.id}" placeholder="Room Password" value="${t.roomPass || ''}">
      <button class="green" onclick="updateRoom('${t.id}')">Update Room ID & Pass</button>
      <button onclick="delMatch('${t.id}')" style="background:#444;margin-top:6px">Delete Match</button>
    </div>`;
  }).join("") : "<p>No matches created yet.</p>";
});

window.updateRoom = async (id) => {
  const roomId = $("rid_" + id).value.trim();
  const roomPass = $("rpass_" + id).value.trim();
  await updateDoc(doc(db, "tournaments", id), { roomId, roomPass });
  alert("✅ Room ID & Password players ko bhej diya gaya!");
};

window.delMatch = async (id) => {
  if(confirm("Delete this match?")) await deleteDoc(doc(db, "tournaments", id));
};

onSnapshot(collection(db, "walletRequests"), snap => {
  const reqs = snap.docs.map(d => ({id: d.id, ...d.data()})).filter(r => r.status === "pending");
  $("walletList").innerHTML = reqs.length ? reqs.map(r => `
    <div class="item">
      <b>${r.type.toUpperCase()}</b> — ₹${r.amount}<br>
      Player: ${r.name} (UID: ${r.uid})<br>
      <b>UTR / UPI:</b> ${r.detail}<br>
      ${r.type === "deposit" ? `<button class="green" onclick="approveDep('${r.id}','${r.uid}',${r.amount})">Approve & Add ₹${r.amount}</button>` : `<button class="green" onclick="markDone('${r.id}')">Mark Paid</button>`}
      <button onclick="markDone('${r.id}')" style="background:#444">Reject / Remove</button>
    </div>
  `).join("") : "<p>No pending wallet requests.</p>";
});

window.approveDep = async (reqId, uid, amount) => {
  const uRef = doc(db, "users", uid);
  const snap = await getDoc(uRef);
  if(snap.exists()){
    const cur = snap.data().wallet || 0;
    await updateDoc(uRef, { wallet: cur + Number(amount) });
  }
  await updateDoc(doc(db, "walletRequests", reqId), { status: "approved" });
  alert("✅ Player ke wallet mein ₹" + amount + " add ho gaye!");
};

window.markDone = async (reqId) => {
  await updateDoc(doc(db, "walletRequests", reqId), { status: "done" });
};

window.sendPrize = async () => {
  const uid = $("winUid").value.trim();
  const amt = Number($("winAmt").value);
  if(!uid || amt <= 0) return alert("Valid FF UID aur Amount dalein!");
  const uRef = doc(db, "users", uid);
  const snap = await getDoc(uRef);
  if(!snap.exists()) return alert("Is FF UID ka player nahi mila!");
  await updateDoc(uRef, { wallet: (snap.data().wallet || 0) + amt });
  $("winUid").value = ""; $("winAmt").value = "";
  alert("✅ ₹" + amt + " player ke wallet mein bhej diye gaye!");
};

window.addLeaderboard = async () => {
  const playerName = $("lbName").value.trim();
  const points = Number($("lbPts").value) || 0;
  if(!playerName) return alert("Player name dalein!");
  await addDoc(collection(db, "leaderboard"), { playerName, points });
  $("lbName").value = ""; $("lbPts").value = "";
  alert("✅ Leaderboard score added!");
};
</script>
</body>
</html>
