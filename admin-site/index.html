<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZyvoBattle — Admin Panel</title>
<style>
:root{--bg:#0b0b0f;--panel:#17171d;--red:#ff3038;--green:#00c853;--text:#f5f5f7;--line:#34343e}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 sans-serif;padding:14px}
.wrap{max-width:600px;margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
input{width:100%;padding:12px;background:#101015;color:#fff;border:1px solid #454550;border-radius:8px;margin:6px 0 12px}
button{border:0;border-radius:8px;background:var(--red);color:#fff;font-weight:bold;padding:12px;width:100%;cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h2>🛡️ Admin Control Panel</h2>

  <!-- PIN LOGIN -->
  <div id="loginBox" class="card">
    <h3>Enter Admin PIN</h3>
    <input id="pin" type="password" placeholder="PIN (1234)">
    <button id="loginBtn">Login</button>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="adminBox" class="card hidden">
    <h3>Create Tournament</h3>
    <input id="matchName" placeholder="Match Name (e.g. Free Fire Solo Classic)">
    <input id="entryFee" type="number" placeholder="Entry Fee (₹)">
    <input id="prize" type="number" placeholder="Prize Pool (₹)">
    <input id="roomId" placeholder="Room ID & Password">
    <button id="createMatchBtn" class="green">Publish Match</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDJpr9gktLVZgPOF2K89mOlubJrddw9OT0",
  authDomain: "zyvobettle.firebaseapp.com",
  projectId: "zyvobettle",
  storageBucket: "zyvobettle.firebasestorage.app",
  messagingSenderId: "335264733948",
  appId: "1:335264733948:web:30217c54d3e15c8b1bd579"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = id => document.getElementById(id);

$("loginBtn").addEventListener("click", () => {
  if($("pin").value === "1234"){
    $("loginBox").classList.add("hidden");
    $("adminBox").classList.remove("hidden");
  } else {
    alert("Galat PIN! (Sahi PIN: 1234)");
  }
});

$("createMatchBtn").addEventListener("click", async () => {
  const name = $("matchName").value.trim();
  const entryFee = Number($("entryFee").value);
  const prize = Number($("prize").value);
  const roomId = $("roomId").value.trim();

  if(!name) return alert("Match ka naam daalein!");

  try {
    await addDoc(collection(db, "tournaments"), {
      name, entryFee, prize, roomId, createdAt: Date.now()
    });
    alert("Tournament successfully publish ho gaya!");
    $("matchName").value = "";
    $("entryFee").value = "";
    $("prize").value = "";
    $("roomId").value = "";
  } catch(e) {
    alert("Error: " + e.message);
  }
});
</script>
</body>
</html>
